<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="安全、清晰的个人消费与预算管理工具">
    <title>{% block title %}安心账本{% endblock %}</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}?v=20260824-2">
    <script defer src="{{ request.url_for('static', path='app.js') }}"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ '/dashboard' if current_user else '/' }}">
            <span class="brand-mark">安</span>
            <span>安心账本</span>
        </a>
        {% if current_user %}
        <button class="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">☰</button>
        <nav class="main-nav" aria-label="主要导航">
            <a href="/dashboard">概览</a>
            <a href="/expenses">消费记录</a>
            <a href="/budgets">预算</a>
            <a href="/account">账户</a>
            <form action="/logout" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button class="nav-logout" type="submit">退出</button>
            </form>
        </nav>
        {% else %}
        <nav class="public-nav" aria-label="账户导航">
            <a href="/login">登录</a>
            <a class="button button-small" href="/register">免费注册</a>
        </nav>
        {% endif %}
    </header>

    {% if messages %}
    <section class="flash-stack" aria-live="polite">
        {% for message in messages %}
        <div class="flash flash-{{ message.kind }}">{{ message.text }}</div>
        {% endfor %}
    </section>
    {% endif %}

    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <span>安心账本</span>
        <span>你的数据，只属于你的账户</span>
    </footer>
</body>
</html>
