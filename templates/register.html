{% extends "base.html" %}
{% block title %}注册｜安心账本{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <span class="eyebrow">建立你的私人账本</span>
        <h1>创建账户</h1>
        <p class="muted">注册后即可保存并管理自己的消费数据。</p>
        {% if errors %}<div class="form-errors">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
        <form class="form-stack" method="post" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>用户名<input name="username" required minlength="2" maxlength="50" autocomplete="name" value="{{ form.username if form else '' }}"></label>
            <label>邮箱<input type="email" name="email" required maxlength="255" autocomplete="email" value="{{ form.email if form else '' }}"></label>
            <label>密码<input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password"><small>至少8个字符</small></label>
            <label>确认密码<input type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password"></label>
            <button class="button button-full" type="submit">创建账户</button>
        </form>
        <p class="auth-switch">已有账户？<a href="/login">立即登录</a></p>
    </div>
</section>
{% endblock %}
